[package]
name = "vulcan"
version = "0.6.4"
edition = "2021"
description = "Vulcan — AI-native CLI for Phoenix Perpetuals DEX on Solana"

[features]
default = []
aws-kms-signer = ["vulcan-lib/aws-kms-signer"]

[[bin]]
name = "vulcan"
path = "src/main.rs"

[dependencies]
vulcan-lib = { workspace = true }

clap    = { workspace = true }
tokio   = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow  = { workspace = true }
rpassword = { workspace = true }
rmcp    = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
