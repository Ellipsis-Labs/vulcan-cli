[workspace]
members  = ["vulcan", "vulcan-lib"]
resolver = "2"

[workspace.dependencies]
vulcan-lib = { path = "vulcan-lib" }

# Rise SDK
phoenix-rise = "0.1.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"

# HTTP
reqwest = { version = "0.13", features = ["json"] }

# Solana
solana-sdk = "~4.0"
solana-pubkey = { version = "~4.2", features = ["curve25519"] }
solana-instruction = { version = "~3.4", default-features = false, features = ["std"] }
solana-rpc-client = "~3.1"

# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
zeroize = { version = "1", features = ["derive"] }

# Encoding
bs58 = "0.5"
base64 = "0.22"

# Output
comfy-table = "7"
colored = "3"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Versioning
semver = "1"

# Password input
rpassword = "7"

# MCP
rmcp = { version = "1.7", features = ["server", "transport-io"] }
schemars = "1.0"

# Directories
dirs = "6"

# Technical analysis
kand = "0.2"
